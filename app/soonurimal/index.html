<!DOCTYPE html>
<!--
  순우리말 낱말 사전 (2학년 슬기로운생활 수업용)

  - 단어 19개만 들어 있는 작은 사전이다. 수업 활동지에 나온 낱말만 찾아진다.
  - 파일 하나로 끝난다. 빌드도 서버도 필요 없고, 한 번 열어 두면 인터넷이 끊겨도 된다.
  - 글꼴(Jua)만 구글에서 받아 온다. 못 받으면 기기 기본 글꼴로 보인다.
  - 낱말을 고치거나 더할 때는 아래 WORDS 만 손대면 된다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe9a8">
  <title>순우리말 낱말 사전</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #4a3b2a;
      --ink-soft: #7d6a55;
      --paper: #fffdf6;
      --sky: #cfeeff;
      --sun: #ffd45e;
      --pink: #ffc4d6;
      --mint: #c5f0d8;
      --lilac: #e0d4ff;
      --peach: #ffd9b8;
      --line: #f0dfb8;
      --accent: #ff8a5b;
      --card: #fff3c9;          /* 낱말 카드마다 JS가 덮어쓴다 */
      --card-deep: #ffd45e;
      --font: "Jua", "Gaegu", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 8%, #fff 0 38px, transparent 39px),
        radial-gradient(circle at 18% 9%, #fff 0 28px, transparent 29px),
        radial-gradient(circle at 86% 14%, #fff 0 34px, transparent 35px),
        radial-gradient(circle at 92% 16%, #fff 0 24px, transparent 25px),
        linear-gradient(#bfe8ff 0, #e6f7ff 260px, #fff8dc 520px, #fff8dc 100%);
      background-attachment: scroll;
      padding-bottom: 60px;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

    /* ── 머리 ───────────────────────── */
    header { text-align: center; padding: 26px 0 10px; position: relative; }
    .logo { font-size: clamp(34px, 8vw, 54px); line-height: 1.1; margin: 0; letter-spacing: 1px;
            color: #ff7a59; text-shadow: 3px 3px 0 #fff, 5px 5px 0 #ffd0bf; }
    .logo small { display: block; font-size: .42em; color: var(--ink); text-shadow: none; letter-spacing: 0; margin-top: 6px; }
    .mascot { font-size: 64px; display: inline-block; animation: bob 2.4s ease-in-out infinite; }
    .twinkle { position: absolute; font-size: 26px; animation: twinkle 2.2s ease-in-out infinite; }
    .twinkle.a { left: 6%; top: 40px; }
    .twinkle.b { right: 8%; top: 70px; animation-delay: .8s; }
    .twinkle.c { left: 20%; top: 120px; animation-delay: 1.4s; font-size: 20px; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-9px) rotate(3deg); } }
    @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }

    /* ── 검색 ───────────────────────── */
    .search {
      background: var(--paper);
      border: 4px solid var(--sun);
      border-radius: 32px;
      padding: 14px;
      box-shadow: 0 8px 0 #f2c14a, 0 14px 24px rgba(120, 90, 30, .15);
      margin-top: 8px;
    }
    .search label { display: block; font-size: 20px; margin: 2px 6px 8px; color: var(--ink-soft); }
    .row { display: flex; gap: 10px; }
    .search input {
      flex: 1; min-width: 0;
      font: inherit; font-size: 30px; color: var(--ink);
      padding: 12px 18px; border: 3px solid var(--line); border-radius: 22px; background: #fff;
      outline: none;
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 5px #ffe0d2; }
    .search input::placeholder { color: #cdbd9f; }
    button {
      font: inherit; cursor: pointer; border: 0; color: var(--ink);
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .go {
      font-size: 26px; padding: 0 24px; border-radius: 22px;
      background: var(--accent); color: #fff; box-shadow: 0 5px 0 #d96a3c;
      white-space: nowrap;
    }
    .go:active { transform: translateY(4px); box-shadow: 0 1px 0 #d96a3c; }

    /* ── 결과 ───────────────────────── */
    #result { margin-top: 26px; }
    .welcome, .nope {
      text-align: center; background: rgba(255,255,255,.75); border: 3px dashed #f0c96b;
      border-radius: 28px; padding: 22px 16px; font-size: 22px; line-height: 1.6;
    }
    .welcome .big, .nope .big { font-size: 56px; display: block; margin-bottom: 4px; }
    .nope b { color: #e0553a; }

    .entry {
      background: var(--paper);
      border: 4px solid var(--card-deep);
      border-radius: 36px;
      box-shadow: 0 8px 0 var(--card-deep), 0 16px 28px rgba(120, 90, 30, .15);
      overflow: hidden;
      animation: pop .45s cubic-bezier(.2, 1.4, .4, 1);
    }
    @keyframes pop { from { transform: scale(.92); } to { transform: scale(1); } }
    .scene {
      background: var(--card); position: relative; text-align: center;
      padding: 26px 12px 18px; overflow: hidden;
    }
    .scene::before, .scene::after {
      content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.55);
    }
    .scene::before { width: 180px; height: 180px; left: -50px; bottom: -80px; }
    .scene::after  { width: 130px; height: 130px; right: -30px; top: -50px; }
    .pictures { position: relative; z-index: 1; font-size: clamp(64px, 17vw, 104px); line-height: 1.1; }
    .pictures span { display: inline-block; animation: bob 2.6s ease-in-out infinite; }
    .pictures span:nth-child(2) { animation-delay: .5s; }
    .pictures span:nth-child(3) { animation-delay: 1s; }
    .word { position: relative; z-index: 1; margin: 6px 0 0; font-size: clamp(46px, 13vw, 72px); line-height: 1.1; color: var(--ink); text-shadow: 3px 3px 0 #fff; }
    .kind {
      position: relative; z-index: 1; display: inline-block; margin-top: 8px;
      font-size: 18px; padding: 4px 14px; border-radius: 999px; background: #fff; color: var(--ink-soft);
    }
    .say {
      position: absolute; z-index: 2; right: 14px; top: 14px;
      font-size: 22px; padding: 8px 16px; border-radius: 999px; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.12);
    }
    .say:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.12); }

    .body { padding: 20px 22px 24px; }
    .sec { margin: 0 0 18px; }
    .sec h3 {
      margin: 0 0 8px; font-size: 22px; font-weight: normal;
      display: inline-block; padding: 3px 14px; border-radius: 999px; background: var(--card);
    }
    .sec p { margin: 0; font-size: 26px; line-height: 1.55; word-break: keep-all; }
    .sec p em { font-style: normal; background: linear-gradient(transparent 58%, #ffe27a 58%); }
    .sec.example p { background: #fff8e1; border-radius: 20px; padding: 12px 16px; border: 2px dashed #f0d58a; }
    .sec.tip p { font-size: 22px; color: var(--ink-soft); }
    .more { font-size: 22px; color: var(--ink-soft); margin: 0; }

    /* ── 도장판 ───────────────────────── */
    .board { margin-top: 38px; background: rgba(255,255,255,.8); border: 3px solid #f0dfb8; border-radius: 30px; padding: 16px 14px 20px; }
    .board h2 { margin: 0 0 4px; font-size: 26px; font-weight: normal; text-align: center; }
    .board .count { text-align: center; font-size: 20px; color: var(--ink-soft); margin-bottom: 12px; }
    .bar { height: 16px; background: #fff; border: 2px solid #f0dfb8; border-radius: 999px; overflow: hidden; margin: 0 auto 14px; max-width: 360px; }
    .bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(45deg, #ffb347 0 12px, #ffcb6b 12px 24px); transition: width .5s; }
    .stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; }
    .stamp {
      aspect-ratio: 1 / 1; border-radius: 22px; border: 3px dashed #e3d4ad; background: #fffaf0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 18px; color: #d3c29a; padding: 4px; cursor: default; user-select: none;
    }
    .stamp .em { font-size: 34px; line-height: 1; }
    .stamp.got { border: 3px solid var(--card-deep); background: var(--card); color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 var(--card-deep); }
    .stamp.got:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-deep); }
    .stamp.new { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
    .reset { display: block; margin: 16px auto 0; font-size: 16px; color: #b6a68a; background: none; text-decoration: underline; padding: 6px; }

    footer { text-align: center; color: var(--ink-soft); font-size: 16px; margin-top: 26px; }

    @media (max-width: 520px) {
      .search input { font-size: 24px; padding: 10px 14px; }
      .go { font-size: 22px; padding: 0 16px; }
      .sec p { font-size: 22px; }
      .body { padding: 16px 16px 20px; }
      .mascot { font-size: 52px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="twinkle a">✨</span><span class="twinkle b">⭐</span><span class="twinkle c">✨</span>
    <div class="mascot" aria-hidden="true">🐣</div>
    <h1 class="logo">순우리말 낱말 사전<small>궁금한 우리말을 찾아보자!</small></h1>
  </header>

  <form class="search" id="form" autocomplete="off">
    <label for="q">활동지에 있는 순우리말을 써 보세요</label>
    <div class="row">
      <input id="q" type="text" inputmode="text" enterkeyhint="search" placeholder="예) 미리내" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="go" type="submit">찾기 🔍</button>
    </div>
  </form>

  <main id="result" aria-live="polite"></main>

  <section class="board" aria-label="내가 찾은 낱말">
    <h2>🏅 내가 찾은 낱말 도장판</h2>
    <div class="count" id="count"></div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="stamps" id="stamps"></div>
    <button class="reset" id="reset" type="button">도장판 처음부터 다시 하기</button>
  </section>

  <footer>슬기로운 생활 · 인물 – 한글을 찾아서</footer>
</div>

<script>

   tint  : 카드 바탕색, deep: 테두리색
   note  : 교사 확인용 메모. 화면에는 나오지 않는다.
   ───────────────────────────────────────────────────────────── */

    tip: '물이 넓고 길게 흘러가는 곳이에요.',

  { word: '다솜', kind: 'name', art: ['💗', '🤗'], tint: '#ffd6e3', deep: '#f59ab8',

    same: '생글생글' },

  { word: '몽글몽글', kind: 'look', art: ['☁️', '🍮'], tint: '#e4f4ff', deep: '#92c8ee',
    mean: '작고 둥글게 <em>말랑말랑 뭉쳐 있는 모양</em>이에요.',
    ex: '하늘에 몽글몽글 구름이 피어올라요.',
    tip: '구름이나 김이 동글동글 피어오르는 모양에도 써요.',
    same: '' },

  { word: '아라', kind: 'name', art: ['🌊', '🐋'], tint: '#cfeeff', deep: '#6fb9ea',
    mean: '<em>바다</em>를 부르는 옛날 우리말이라고 알려져 있어요.',
    ex: '푸른 아라에 고래가 헤엄쳐요.',
    tip: '넓고 푸른 물이 가득한 곳을 떠올려 보세요.',
    same: '바다',
    note: '‘바다’라는 풀이는 널리 퍼져 있으나 국어사전·문헌 근거는 없다는 지적이 있음. 수업에서는 “바다를 뜻한다고 알려진 말”로 소개.' },
];

/* ─── 글자 다루기 ───────────────────────── */
const norm = s => (s || '').normalize('NFC').replace(/[\s​]+/g, '').trim();

/* ─── 도장판 저장 (이 기기에서만) ───────────── */
const KEY = 'soonurimal-found-v1';
let found = new Set();
try { found = new Set(JSON.parse(localStorage.getItem(KEY) || '[]').filter(w => WORDS.some(x => x.word === w))); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...found])); } catch (e) {} };

/* ─── 화면 ───────────────────────── */
const $ = id => document.getElementById(id);
const q = $('q'), result = $('result');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function welcome() {
  result.innerHTML = `
    <div class="welcome"><span class="big">📖</span>
      활동지에 있는 <b>순우리말</b>을 위 칸에 쓰고<br>
      <b>[찾기]</b>를 눌러 보세요!<br>
      찾은 낱말은 아래 <b>도장판</b>에 도장이 쾅! 찍혀요.
    </div>`;
}

function show(w, fromBoard) {
  const el = document.documentElement.style;
  el.setProperty('--card', w.tint);
  el.setProperty('--card-deep', w.deep);
  const isNew = !found.has(w.word);
  found.add(w.word); save();

  const sameLine = w.same ? `<p class="more">🔗 비슷한 말: <b>${esc(w.same)}</b></p>` : '';
  const canSpeak = 'speechSynthesis' in window;
  result.innerHTML = `
    <article class="entry">
      <div class="scene">
        ${canSpeak ? '<button class="say" type="button" id="say" aria-label="소리 듣기">🔊 듣기</button>' : ''}
        <div class="pictures" aria-hidden="true">${w.art.map(a => `<span>${a}</span>`).join('')}</div>
        <h2 class="word">${esc(w.word)}</h2>
        <span class="kind">${KINDS[w.kind]}</span>
      </div>
      <div class="body">
        <div class="sec"><h3>💡 무슨 뜻일까?</h3><p>${w.mean}</p></div>
        <div class="sec example"><h3>✏️ 이렇게 써요</h3><p>${esc(w.ex)}</p></div>
        <div class="sec tip"><h3>🌱 알아 두기</h3><p>${esc(w.tip)}</p>${sameLine ? '<div style="height:8px"></div>' + sameLine : ''}</div>
      </div>
    </article>`;
  const say = $('say');
  if (say) say.onclick = () => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(w.word);
      u.lang = 'ko-KR'; u.rate = .8; u.pitch = 1.2;
      speechSynthesis.speak(u);
    } catch (e) {}
  };
  renderBoard(isNew ? w.word : null);
  try { (fromBoard ? document.body : result).scrollIntoView({ block: 'start' }); } catch (e) {}
}

function nope(text) {
  result.innerHTML = `
    <div class="nope"><span class="big">🤔</span>
      <b>“${esc(text)}”</b> 낱말은 이 사전에 없어요.<br>
      활동지의 낱말을 다시 보고, 글자를 하나하나 확인해 볼까요?
    </div>`;
}

/* 연관 검색은 일부러 두지 않았다. 학생이 낱말을 끝까지 직접 쳐 보게 하려는 것이다.
   글자가 하나라도 다르면 찾아지지 않는다. */
function lookup() {
  const t = norm(q.value);
  if (!t) { q.focus(); return; }
  const hit = WORDS.find(w => w.word === t);
  if (hit) show(hit); else nope(q.value.trim());
}

/* ─── 도장판 ───────────────────────── */
function renderBoard(newWord) {
  $('count').textContent = `${found.size} / ${WORDS.length} 개 찾았어요`;
  $('barfill').style.width = (found.size / WORDS.length * 100) + '%';
  $('stamps').innerHTML = WORDS.map(w => {
    if (!found.has(w.word)) return `<div class="stamp"><span class="em">❔</span>?</div>`;
    return `<button type="button" class="stamp got${w.word === newWord ? ' new' : ''}" data-w="${esc(w.word)}" style="--card:${w.tint};--card-deep:${w.deep}">
      <span class="em">${w.art[0]}</span>${esc(w.word)}</button>`;
  }).join('');
  $('stamps').querySelectorAll('.got').forEach(b => b.onclick = () => {
    const w = WORDS.find(x => x.word === b.dataset.w);
    q.value = w.word; show(w, true);
  });
  $('reset').style.display = found.size ? '' : 'none';
}

$('form').addEventListener('submit', e => { e.preventDefault(); lookup(); });
$('reset').onclick = () => {
  if (!confirm('찾은 낱말 도장을 모두 지울까요?')) return;
  found.clear(); save(); q.value = ''; welcome(); renderBoard();
};

welcome();
renderBoard();
</script>
</body>
</html>
